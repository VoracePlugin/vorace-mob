name: VoraceMob
version: '${version}'
main: fr.vorace.mobs.VoraceMob
api-version: '1.21.4'
description: Mobs avec un cerveau (besoins, troupeaux, laisse, zones, apparitions, volants, décors vivants) pour Vorace
authors: [ORA-KUN]
website: https://github.com/VoracePlugin/vorace-mob
depend: [Vorace]
commands:
  vmob:
    description: Mobs de vorace-mob
    usage: /vmob [liste|invoquer <mob> [nombre]|info [début|*] [joueur]|apparitions|retirer [rayon]|recharger]
    aliases: [voracemob]
    permission: vorace.mob.admin
permissions:
  vorace.mob.admin:
    description: Commandes de vorace-mob
    default: op
